name: autofix.ci
on:
  workflow_call:
  pull_request:
  push:
    branches: [ "main" ]
permissions:
  contents: read

jobs:
  autofix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # Use uvx because this repo does not have a uv project
      # dependency file that would make `uv run ruff` install ruff automatically.
      - uses: astral-sh/setup-uv@fac544c07dec837d0ccb6301d7b5580bf5edae39
        with:
          version: "0.4.20"
      # Fix lint errors
      - run: uvx ruff check --fix-only .
      # Format code
      - run: uvx ruff format .

      - uses: autofix-ci/action@c5b2d67aa2274e7b5a18224e8171550871fc7e4a
